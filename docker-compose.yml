services:
  postgres:
    image: postgres:16-alpine
    container_name: aurebid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aurebid-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: aurebid-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    networks:
      - aurebid-network
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node dist/server.js

networks:
  aurebid-network:
    driver: bridge

volumes:
  postgres_data:
